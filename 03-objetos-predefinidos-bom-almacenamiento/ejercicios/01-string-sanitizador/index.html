<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DÍA 1 - Limpiador de Textos (String)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f6f8;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      max-width: 500px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .campo {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0052a3;
    }
    .resultado {
      margin-top: 20px;
      padding: 15px;
      border-left: 4px solid #0066cc;
      background: #eef6ff;
      border-radius: 0 4px 4px 0;
    }
    .urgente {
      border-left-color: #d9534f;
      background: #fdf2f2;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sanitizador de Comentarios</h2>
    <form id="formTexto">
      <div class="campo">
        <label for="inputNombre">Nombre del usuario:</label>
        <input type="text" id="inputNombre" placeholder="ej.   mARíA  ">
      </div>
      <div class="campo">
        <label for="inputComentario">Comentario:</label>
        <textarea id="inputComentario" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>
      <button type="submit">Procesar y Publicar</button>
    </form>

    <div id="boxResultado" class="resultado" style="display: none;">
      <h3 id="resUsuario"></h3>
      <p id="resComentario"></p>
      <small id="resMetricas"></small>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
